<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto Wallet</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #7c5cff; --ok: #3fb950; --err: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center;
    padding: 14px 24px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; margin: 0; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
  .card { background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  h2 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  input, select { width: 100%; padding: 9px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; }
  button { margin-top: 12px; padding: 9px 14px; border: 0; border-radius: 6px;
    background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; font-size: 14px; }
  button.ghost { background: transparent; border: 1px solid var(--border); margin: 0; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: 13px; }
  .wallet { border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .wallet .sym { font-weight: 700; text-transform: uppercase; }
  .wallet .bal { font-size: 22px; margin: 6px 0; }
  .wallet code { font-size: 11px; color: var(--muted); word-break: break-all; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button { margin: 0; background: transparent; border: 1px solid var(--border); }
  .tabs button.active { background: var(--accent); border-color: var(--accent); }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    padding: 10px 16px; border-radius: 8px; font-size: 14px; max-width: 90vw; }
  #toast.ok { background: var(--ok); color: #fff; }
  #toast.err { background: var(--err); color: #fff; }
  .auth { max-width: 380px; margin: 60px auto; }
</style>
</head>
<body>
<header>
  <h1>⛓ Crypto Wallet</h1>
  <div id="userBox" class="hidden row" style="align-items:center;gap:12px">
    <span class="muted">Signed in as <b id="who"></b></span>
    <button class="ghost" onclick="logout()">Log out</button>
  </div>
</header>

<main>
  <!-- Auth -->
  <section id="authView" class="card auth">
    <div class="tabs">
      <button id="tabLogin" class="active" onclick="authTab('login')">Login</button>
      <button id="tabRegister" onclick="authTab('register')">Register</button>
    </div>
    <form id="authForm">
      <label>Username</label><input id="authUser" required>
      <label>Password</label><input id="authPass" type="password" required>
      <button type="submit" id="authBtn">Login</button>
    </form>
  </section>

  <!-- Dashboard -->
  <section id="appView" class="hidden">
    <div class="card" style="margin-bottom:16px">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h2 style="margin:0">My wallets</h2>
        <button class="ghost" style="flex:0" onclick="loadWallets()">Refresh</button>
      </div>
      <div id="wallets" class="grid" style="margin-top:12px"></div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Create wallet</h2>
        <form onsubmit="return act(event, '/create/wallet', {username: me(), wallet_name: v('cwSym')})">
          <label>Symbol</label>
          <select id="cwSym"><option>btc</option><option>sol</option><option>usd</option></select>
          <button>Create</button>
        </form>
      </div>

      <div class="card">
        <h2>Deposit / Withdraw</h2>
        <form id="dwForm">
          <label>Wallet</label><select id="dwWallet" class="walletSelect"></select>
          <label>Amount</label><input id="dwAmount" type="number" step="any" min="0" required>
          <div class="row">
            <button type="button" onclick="dw('/deposit')">Deposit</button>
            <button type="button" onclick="dw('/withdraw')">Withdraw</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Transfer</h2>
        <form onsubmit="return act(event, '/transfer', {sender_username: me(), reciever_username: v('trTo'),
              amount: +v('trAmount'), wallet_from: v('trWallet'), wallet_to: v('trWallet')})">
          <label>Receiver username</label><input id="trTo" required>
          <label>Wallet</label><select id="trWallet" class="walletSelect"></select>
          <label>Amount</label><input id="trAmount" type="number" step="any" min="0" required>
          <button>Send</button>
        </form>
      </div>

      <div class="card">
        <h2>Convert</h2>
        <form onsubmit="return act(event, '/convert', {username: me(), symbol_from: v('cvFrom'),
              symbol_to: v('cvTo'), amount: parseInt(v('cvAmount'))})">
          <div class="row">
            <div><label>From</label><select id="cvFrom" class="walletSelect"></select></div>
            <div><label>To</label><select id="cvTo" class="walletSelect"></select></div>
          </div>
          <label>Amount (whole number)</label><input id="cvAmount" type="number" step="1" min="1" required>
          <button>Convert</button>
        </form>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <h2>Transactions</h2>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Time</th><th>Wallet</th><th>Type</th><th>Amount</th><th>Details</th></tr></thead>
          <tbody id="txs"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<div id="toast" class="hidden"></div>

<script>
  let mode = 'login';
  const v = id => document.getElementById(id).value.trim();
  const me = () => localStorage.getItem('username');

  function toast(msg, ok = true) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = ok ? 'ok' : 'err';
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.add('hidden'), 3500);
  }

  async function api(path, body) {
    const res = await fetch(path, body ? {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
    } : {cache: 'no-store'});
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const d = data.detail;
      throw new Error(Array.isArray(d) ? d.map(e => `${e.loc.at(-1)}: ${e.msg}`).join(', ') : (d || res.statusText));
    }
    return data;
  }

  function authTab(m) {
    mode = m;
    document.getElementById('tabLogin').classList.toggle('active', m === 'login');
    document.getElementById('tabRegister').classList.toggle('active', m === 'register');
    document.getElementById('authBtn').textContent = m === 'login' ? 'Login' : 'Register';
  }

  document.getElementById('authForm').onsubmit = async e => {
    e.preventDefault();
    const body = {username: v('authUser'), password: document.getElementById('authPass').value};
    try {
      const r = await api('/' + mode, body);
      toast(r.massage);
      if (mode === 'register') { authTab('login'); return; }
      localStorage.setItem('username', body.username);
      show();
    } catch (err) { toast(err.message, false); }
  };

  function logout() { localStorage.removeItem('username'); show(); }

  function show() {
    const u = me();
    document.getElementById('authView').classList.toggle('hidden', !!u);
    document.getElementById('appView').classList.toggle('hidden', !u);
    document.getElementById('userBox').classList.toggle('hidden', !u);
    if (u) { document.getElementById('who').textContent = u; loadWallets(); }
  }

  async function act(e, path, body) {
    e.preventDefault();
    try {
      const r = await api(path, body);
      toast(r.message || r.massage || (r.result !== undefined ? `Converted: ${r.amount} ${r.from} → ${r.result} ${r.to}` : 'Done'));
      e.target.reset();
      loadWallets();
    } catch (err) { toast(err.message, false); }
    return false;
  }

  function dw(path) {
    const form = document.getElementById('dwForm');
    if (!form.reportValidity()) return;
    act({preventDefault() {}, target: form}, path,
        {username: me(), wallet_name: v('dwWallet'), amount: +v('dwAmount')});
  }

  async function loadWallets() {
    try {
      const wallets = await api('/wallet/' + encodeURIComponent(me()));
      const box = document.getElementById('wallets');
      box.innerHTML = wallets.length ? '' : '<p class="muted">No wallets yet — create one below.</p>';
      const txs = [];
      for (const w of wallets) {
        const el = document.createElement('div');
        el.className = 'wallet';
        el.innerHTML = `<div class="sym"></div><div class="bal"></div><code></code>`;
        el.querySelector('.sym').textContent = w.symbol;
        el.querySelector('.bal').textContent = (+w.balance).toLocaleString(undefined, {maximumFractionDigits: 8});
        el.querySelector('code').textContent = w.address;
        box.appendChild(el);
        for (const t of w.transaction) txs.push({...t, wallet: w.symbol});
      }
      document.querySelectorAll('.walletSelect').forEach(sel => {
        const cur = sel.value;
        sel.innerHTML = '';
        for (const w of wallets) sel.add(new Option(w.symbol, w.symbol));
        if (cur) sel.value = cur;
      });
      txs.sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));
      const tbody = document.getElementById('txs');
      tbody.innerHTML = '';
      if (!txs.length) tbody.innerHTML = '<tr><td colspan="5" class="muted">No transactions yet.</td></tr>';
      for (const t of txs) {
        const tr = tbody.insertRow();
        const details = t.type === 'convert' ? `${t.from} → ${t.to} @ ${t.price} = ${t.result}` : '';
        for (const c of [t.timestamp ? new Date(t.timestamp).toLocaleString() : '', t.wallet, t.type, t.amount, details])
          tr.insertCell().textContent = c;
      }
    } catch (err) {
      toast(err.message, false);
      if (err.message === 'User not found') logout();
    }
  }

  show();
</script>
</body>
</html>
